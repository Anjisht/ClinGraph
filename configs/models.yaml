profiles:
  small:
    provider: "ollama"
    model_name: "llama3.2:3b"
    context_window: 4096
    max_tokens: 512
    temperature: 0.1
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.00060
  large:
    provider: "ollama"
    model_name: "llama3.1:8b"
    context_window: 8192
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input_tokens: 0.0010
    cost_per_1k_output_tokens: 0.0020
  fake:
    provider: "fake"
    model_name: "deterministic-mock-v1"
    context_window: 4096
    max_tokens: 512
    temperature: 0.0
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0

routing_rules:
  max_small_evidence_tokens: 2000
  multi_hop_requires_large: true
  contradiction_requires_large: true
  fallback_to_abstain: true
